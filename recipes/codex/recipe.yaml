phoenix_recipe: 1
name: codex
harness_versions: ["0.169.0"]
login_modes: [api-key, chatgpt, chatgpt-custom-provider, custom-api-key, custom-oauth, command-auth, local, bedrock, vertex]
routes:
  - versions: "0.169.0"
    login_mode: api-key
    surfaces: &native
      model: [transcript]
      mcp: [mcp-proxy, transcript]
      cli: [cli-proxy, transcript]
  - versions: "0.169.0"
    login_mode: chatgpt
    surfaces: *native
  - versions: "0.169.0"
    login_mode: chatgpt-custom-provider
    surfaces: &http
      model: [transcript]
      mcp: [mcp-proxy, transcript]
      cli: [cli-proxy, transcript]
  - versions: "0.169.0"
    login_mode: custom-api-key
    surfaces: *http
  - versions: "0.169.0"
    login_mode: custom-oauth
    surfaces: *http
  - versions: "0.169.0"
    login_mode: command-auth
    surfaces: *http
  - versions: "0.169.0"
    login_mode: local
    surfaces: *http
  - versions: "0.169.0"
    login_mode: bedrock
    surfaces: *native
  - versions: "0.169.0"
    login_mode: vertex
    surfaces: *native
mcp:
  file: ~/.codex/config.toml
  format: mcp_servers (TOML)
shim: [ls]
transcript_reader:
  command: [node, transcript-reader.ts]
  harness_versions: ["0.169.0"]
clock:
  probe: [node, clock-probe.ts]
copy_ignored: false
launcher: [node, capture.ts]
resume:
  moment: [node, moment.mjs]
  login: [node, login.mjs]
  image: resume.Dockerfile
  command: [node, /phoenix/recipe/resume.mjs]
  llm_hosts:
    chatgpt: [chatgpt.com]
limitations:
  - Phoenix never sits between Codex and its LLM; the LLM side comes only from Codex's own session file
  - No authentication or billing route is changed; a failed explicit route is refused instead of silently replaced
  - Project-local .codex/config.toml layers require transcript capture or explicit import; live MCP routing is refused
  - Command-line config/profile/cwd overrides are refused; use the recipe's --cwd to choose the snapshotted task directory
  - Remote MCP URLs are rewritten only with --reverse-mcp naming servers whose authorization remains valid at a loopback URL
  - Remote OAuth, ChatGPT-bound MCP, managed restrictions, native Bedrock signing and Vertex credentials fall back to transcripts
  - Transcripts are model-visible items, not HTTP exchanges, complete tool catalogs, MCP protocol envelopes, raw CLI streams or filesystem side effects
  - Absolute commands, shell builtins, reset shell PATH, dynamic/plugin MCP servers and direct HTTP calls can bypass live capture
  - MCP servers with an explicit PATH keep their executable resolution and bypass the generic CLI shims
  - Static Linux builds may use the real clock; clock coverage is informational, not a fidelity penalty
